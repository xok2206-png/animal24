<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국가동물24 — News Showcase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ─────────────────────────────────────────────
   Design tokens — 국가동물24 Design System
   ───────────────────────────────────────────── */
:root{
  --brand-primary:#4a90e2;
  --brand-primary-hover:#2457c5;
  --brand-primary-surface:#e8f1ff;

  --text-primary:#1f2937;
  --text-body:#6b7280;
  --text-caption:#9ca3af;
  --text-inverse:#fff;

  --surface:#fff;
  --border-default:#e5e7eb;
  --page-bg:#f7fafd;

  --status-protected:#2457c5;      --status-protected-bg:#e8f1ff;
  --status-adoption:#2f8f46;       --status-adoption-bg:#eef8f0;
  --status-ended:#6b7280;          --status-ended-bg:#f3f4f6;
  --status-reserved:#d97706;       --status-reserved-bg:#fff7e8;

  --radius-l:20px;
  --radius-full:999px;

  --shadow-hero:0 14px 34px rgba(51,89,153,.08);
  --shadow-card:0 12px 28px rgba(51,89,153,.08);
  --shadow-card-hover:0 22px 44px rgba(51,89,153,.16);
  --shadow-btn:0 8px 18px rgba(74,143,227,.3);
  --shadow-s:0 2px 8px rgba(15,23,42,.08);

  /* motion */
  --slide-duration:5000ms;         /* 자동 슬라이드 주기 */
  --ease-out:cubic-bezier(.22,.61,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --ease-apple:cubic-bezier(.32,.72,0,1);   /* 초반에 훅 나가고 길게 안착 — Apple 특유의 감속 */
  --ease-pan:cubic-bezier(.15,.55,.35,1);   /* Ken Burns 감속 */
  --rise:20px;                     /* 텍스트가 아래에서 올라오는 거리 */
  --blur-in:8px;                   /* 등장 시 걷히는 블러 */
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  margin:0;
  background:var(--page-bg);
  color:var(--text-primary);
  font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  letter-spacing:0;
}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ─────────────────────────────────────────────
   Section shell
   ───────────────────────────────────────────── */
.news-section{padding:160px 0}
.container{width:min(1440px,100% - 96px);margin-inline:auto}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:40px}
.section-head__text{display:flex;flex-direction:column;gap:24px;align-items:flex-start}

.chip{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;
  background:var(--brand-primary-surface);
  border:1px solid var(--brand-primary-hover);
  border-radius:var(--radius-full);
  color:var(--brand-primary-hover);
  font-size:14px;font-weight:500;line-height:22px;
  filter:drop-shadow(0 2px 4px rgba(15,23,42,.08));
}
.chip svg{width:20px;height:20px}

.section-head h2{
  margin:0;font-size:48px;line-height:60px;font-weight:700;
  letter-spacing:-.96px;color:var(--text-primary);
}
.section-head p{margin:0;font-size:18px;line-height:30px;font-weight:400;color:var(--text-body)}

.viewall{
  display:inline-flex;align-items:center;gap:8px;
  height:54px;padding:0 26px;flex:none;
  border:1px solid var(--border-default);border-radius:var(--radius-full);
  background:var(--surface);color:var(--text-primary);
  font-size:14px;font-weight:500;
  transition:background .3s var(--ease-soft),border-color .3s var(--ease-soft),
             color .3s var(--ease-soft),box-shadow .3s var(--ease-soft),transform .3s var(--ease-out);
}
.viewall .chev{transition:transform .3s var(--ease-out)}
.viewall:hover{
  background:var(--brand-primary);border-color:var(--brand-primary);
  color:var(--text-inverse);box-shadow:var(--shadow-btn);transform:translateY(-2px);
}
.viewall:hover .chev{transform:translateX(4px)}

.divider{height:1px;margin:40px 0 0;border:0;background:var(--border-default);transform-origin:left center}

/* ─────────────────────────────────────────────
   Showcase grid
   ───────────────────────────────────────────── */
.showcase{
  display:grid;
  grid-template-columns:776fr 640fr;
  column-gap:24px;row-gap:36px;
  margin-top:41px;
}

/* ── Hero ─────────────────────────────────── */
.hero{
  position:relative;height:500px;overflow:hidden;
  background:var(--surface);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow-hero);
}

/* 1px 테두리를 border 대신 오버레이 링으로 그린다.
   border 를 쓰면 absolute 자식의 기준(padding box)이 1px 안쪽으로 밀려
   Figma 좌표가 전부 +1px 어긋난다. */
.hero::after,.card::after,.notice::after{
  content:'';position:absolute;inset:0;z-index:3;
  border:1px solid var(--border-default);
  border-radius:inherit;pointer-events:none;
  transition:border-color .4s var(--ease-soft);
}

/* z-index:0 으로 자체 스태킹 컨텍스트를 만든다.
   이게 없으면 활성 이미지의 z-index:1 이 scrim·텍스트·nav·도트 위로 올라가 전부 가린다. */
.hero__media{position:absolute;inset:0;z-index:0}
.hero__media img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transform:scale(1);
  transition:opacity 1200ms var(--ease-soft);
  will-change:opacity,transform;
}
/* Fade + Ken Burns: 100% → 105% over the full slide duration.
   들어오는 이미지를 항상 위에 얹어 크로스페이드 중 배경이 비치지 않게 한다. */
.hero__media img.is-active{
  opacity:1;z-index:1;
  animation:kenburns var(--slide-duration) var(--ease-pan) forwards;
}
.hero.is-paused .hero__media img.is-active{animation-play-state:paused}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.05)}}

/* Photo Fade — 흰색 → 투명 (68%) */
.hero__scrim{
  position:absolute;inset:0;
  background:linear-gradient(to right,#fff 0%,rgba(255,255,255,.92) 42%,rgba(255,255,255,0) 68%);
}

/* 좌표 고정: Figma 기준 y = 39 / 103 / 207 / 299.
   흐름 배치는 뱃지 baseline 여백과 문구 줄 수에 따라 밀리므로 전부 absolute 로 박는다. */
.hero__body{position:absolute;inset:0;pointer-events:none}
.hero__body>*{position:absolute;left:39px;margin:0}
.hero__badge{
  top:39px;
  display:inline-flex;padding:8px 16px;border-radius:var(--radius-full);
  font-size:13px;font-weight:700;line-height:18px;white-space:nowrap;
}
.hero__title{top:103px;width:min(340px,44%);font-size:32px;line-height:42px;font-weight:700;color:var(--text-primary)}
.hero__desc{top:207px;width:min(340px,44%);font-size:16px;line-height:26px;font-weight:400;color:var(--text-body)}

.hero__cta{
  top:299px;pointer-events:auto;
  display:inline-flex;align-items:center;gap:8px;
  padding:16px 24px;border-radius:var(--radius-l);
  background:var(--brand-primary);color:var(--text-inverse);
  font-size:14px;font-weight:500;line-height:22px;
  box-shadow:var(--shadow-btn);
  transition:background .3s var(--ease-soft),box-shadow .3s var(--ease-soft),transform .3s var(--ease-out);
}
.hero__cta .chev{transition:transform .3s var(--ease-out)}
.hero__cta:hover{background:var(--brand-primary-hover);box-shadow:0 12px 26px rgba(36,87,197,.36);transform:translateY(-2px)}
.hero__cta:hover .chev{transform:translateX(4px)}

/* 텍스트 순차 등장: 아래에서 20px 올라오며 Fade + 블러 해제 */
.rise{opacity:0;transform:translateY(var(--rise));filter:blur(var(--blur-in))}
.rise.is-in{
  opacity:1;transform:none;filter:blur(0);
  transition:opacity 720ms var(--ease-soft) var(--d,0ms),
             transform 720ms var(--ease-apple) var(--d,0ms),
             filter 720ms var(--ease-soft) var(--d,0ms);
}
/* 퇴장: 제자리에서 조용히 녹아 사라진다 (아래로 다시 내려가지 않음) */
.rise.is-out{
  opacity:0;transform:none;filter:blur(4px);
  transition:opacity 280ms linear,filter 280ms linear;
}

/* 진입 연출이 끝나면 Hero 문구는 완전히 고정된다.
   이후 슬라이드 전환은 위치·블러 변화 없이 제자리 크로스페이드만 남는다. */
.hero__body.is-settled{--rise:0px;--blur-in:0px}
.hero__body.is-settled .rise.is-out{filter:none}

/* ── Hero controls ────────────────────────── */
.hero__nav{position:absolute;left:39px;top:423px;display:flex;align-items:center;gap:16px}
.hero__counter{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.hero__counter b{font-size:16px;line-height:26px;font-weight:400;color:var(--text-primary);font-variant-numeric:tabular-nums}
.hero__counter span{font-size:14px;line-height:22px;font-weight:500;color:var(--text-caption)}

.navbtn{
  width:40px;height:40px;border-radius:var(--radius-full);
  background:var(--surface);border:1px solid var(--border-default);
  display:grid;place-items:center;
  font-size:18px;font-weight:700;line-height:1;color:var(--text-primary);
  transition:background .25s var(--ease-soft),border-color .25s var(--ease-soft),
             color .25s var(--ease-soft),box-shadow .25s var(--ease-soft),transform .25s var(--ease-out);
}
.navbtn:hover{background:var(--brand-primary);border-color:var(--brand-primary);color:var(--text-inverse);box-shadow:var(--shadow-btn);transform:translateY(-2px)}
.navbtn:active{transform:translateY(0) scale(.94)}

/* ── Dots + Progress bar ──────────────────── */
.hero__dots{position:absolute;left:537px;top:465px;display:flex;align-items:center;gap:8px}
.dot{
  width:7px;height:7px;border-radius:var(--radius-full);
  background:#d5dbe4;flex:none;position:relative;overflow:hidden;
  transition:background .5s var(--ease-soft);   /* 폭은 애니메이션하지 않는다 — 고정 */
}
.dot:hover{background:#b6c0cd}
/* Figma: 활성 도트 20 × 7. 트랙(연한 브랜드색) 위로 fill 이 차오르고,
   100% 시점에 Figma 의 단색 필과 동일해진다. */
.dot.is-active{width:20px;background:rgba(74,143,227,.24)}
.dot.is-active:hover{background:rgba(74,143,227,.24)}
/* 남은 시간 = fill 이 좌→우로 차오름 */
.dot__fill{
  position:absolute;inset:0;border-radius:inherit;
  background:var(--brand-primary);
  transform:scaleX(0);transform-origin:left center;
  opacity:0;
}
.dot.is-active .dot__fill{opacity:1}

/* ── Notice panel ─────────────────────────── */
.notice{
  position:relative;
  height:500px;padding:28px 32px 0;
  background:var(--surface);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow-hero);
}
.notice__head{display:flex;align-items:center;gap:10px;height:30px}
.notice__head h3{margin:0;font-size:20px;line-height:30px;font-weight:700}
.notice__head svg{width:16px;height:16px;color:var(--brand-primary)}
.notice__more{
  margin-left:auto;font-size:14px;line-height:22px;font-weight:500;color:var(--text-body);
  display:inline-flex;align-items:center;gap:4px;
  transition:color .25s var(--ease-soft);
}
.notice__more .chev{transition:transform .3s var(--ease-out)}
.notice__more:hover{color:var(--brand-primary)}
.notice__more:hover .chev{transform:translateX(3px)}

.notice__list{list-style:none;margin:26px 0 0;padding:0}
.notice__item{border-top:1px solid var(--border-default)}
.notice__item:first-child{border-top:0}
.notice__btn{
  display:flex;align-items:center;gap:16px;width:100%;
  height:77px;text-align:left;position:relative;
  transition:background .3s var(--ease-soft);
}
.notice__btn::before{
  content:'';position:absolute;left:-32px;right:-32px;top:0;bottom:0;
  background:var(--brand-primary-surface);opacity:0;
  transition:opacity .3s var(--ease-soft);
}
.notice__btn>*{position:relative}
.notice__item.is-current .notice__btn::before{opacity:1}

.notice__num{
  width:42px;height:32px;flex:none;display:grid;place-items:center;
  border-radius:8px;background:#f3f4f6;
  font-size:14px;line-height:22px;font-weight:500;color:var(--text-body);
  font-variant-numeric:tabular-nums;
  transition:background .3s var(--ease-soft),color .3s var(--ease-soft);
}
.notice__item.is-current .notice__num{background:var(--brand-primary);color:var(--text-inverse)}

.notice__title{
  font-size:16px;line-height:26px;font-weight:500;color:var(--text-primary);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  transition:color .3s var(--ease-soft),transform .35s var(--ease-out);
}
.notice__item.is-current .notice__title{color:var(--brand-primary-hover);transform:translateX(3px)}

.notice__flag{
  flex:none;padding:3px 10px;border-radius:var(--radius-full);
  background:#fdecec;color:#c0392b;font-size:13px;line-height:20px;font-weight:500;
}
.notice__date{
  margin-left:auto;flex:none;display:flex;align-items:center;gap:10px;
  font-size:14px;line-height:22px;font-weight:500;color:var(--text-caption);
  font-variant-numeric:tabular-nums;
}
.notice__date::before{content:'';width:4px;height:4px;border-radius:50%;background:#d5dbe4}

/* ── Card row ─────────────────────────────── */
.cards{
  grid-column:1 / -1;
  display:grid;grid-template-columns:repeat(4,1fr);gap:24px;
}
.card{
  position:relative;height:268px;overflow:hidden;text-align:left;width:100%;
  background:var(--surface);
  border-radius:var(--radius-l);
  box-shadow:var(--shadow-card);
  transition:box-shadow .4s var(--ease-soft),transform .4s var(--ease-out);
}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-card-hover)}
.card:hover::after{border-color:#d8e3f2}

.card__media{position:absolute;inset:0}
.card__media img{
  width:100%;height:100%;object-fit:cover;
  transform:scale(1);
  transition:transform 700ms var(--ease-soft),opacity 260ms var(--ease-soft);
}
.card:hover .card__media img{transform:scale(1.08)}
.card__scrim{
  position:absolute;inset:0;
  background:linear-gradient(to right,#fff 0%,rgba(255,255,255,.9) 48%,rgba(255,255,255,0) 80%);
}

.card__body{position:absolute;left:17px;top:19px;width:200px}
.card__badge{
  display:inline-flex;padding:4px 10px;border-radius:var(--radius-full);
  font-size:13px;line-height:20px;font-weight:500;white-space:nowrap;
}
/* span 이라 기본이 inline — display 를 주지 않으면 제목·날짜가 한 줄에 붙고 세로 margin 도 먹지 않는다 */
.card__title{
  display:block;
  margin:16px 0 0;font-size:20px;line-height:30px;font-weight:700;color:var(--text-primary);
  transition:color .3s var(--ease-soft);
}
.card:hover .card__title{color:var(--brand-primary-hover)}
.card__date{display:block;margin:2px 0 0;font-size:13px;line-height:20px;font-weight:500;color:var(--text-caption)}

.card__arrow{
  position:absolute;left:285px;top:211px;width:40px;height:40px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border-default);
  display:grid;place-items:center;color:var(--text-primary);
  box-shadow:var(--shadow-s);
  transition:transform .4s var(--ease-out),background .35s var(--ease-soft),
             color .35s var(--ease-soft),border-color .35s var(--ease-soft),box-shadow .35s var(--ease-soft);
}
/* Arrow Move on hover */
.card:hover .card__arrow{
  transform:translateX(6px);
  background:var(--brand-primary);border-color:var(--brand-primary);
  color:var(--text-inverse);box-shadow:var(--shadow-btn);
}

/* 카드 내용 교체 시 크로스페이드 */
.card__swap{transition:opacity 220ms var(--ease-soft),transform 220ms var(--ease-out)}
.card.is-swapping .card__swap{opacity:0;transform:translateY(6px)}

/* ─────────────────────────────────────────────
   Section-entry choreography
   ───────────────────────────────────────────── */
.reveal{opacity:0;transform:translateY(24px)}
.is-ready .reveal{
  opacity:1;transform:none;
  transition:opacity 700ms var(--ease-soft) var(--d,0ms),transform 700ms var(--ease-out) var(--d,0ms);
}
.divider{transform:scaleX(0);opacity:0}
.is-ready .divider{transform:scaleX(1);opacity:1;transition:transform 900ms var(--ease-out) 240ms,opacity 400ms linear 240ms}

/* ─────────────────────────────────────────────
   Responsive
   ───────────────────────────────────────────── */
@media (max-width:1439px){
  .hero__dots{left:auto;right:39px}
  .card__arrow{left:auto;right:17px}
  .card__body{width:60%}
}
@media (max-width:1100px){
  .news-section{padding:96px 0}
  .container{width:min(100% - 48px,100%)}
  .showcase{grid-template-columns:1fr}
  .notice{height:auto;padding-bottom:24px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .section-head{flex-direction:column;align-items:flex-start}
  .section-head h2{font-size:36px;line-height:46px}
}
@media (max-width:640px){
  /* 데스크톱 좌표(nav 423 / dots 465)는 460px 높이를 넘으므로 아래쪽 기준으로 다시 잡는다 */
  .hero{height:460px}
  .hero__body>*{left:24px}
  .hero__badge{top:24px}
  .hero__title{top:74px;width:78%;font-size:26px;line-height:36px}
  .hero__desc{top:166px;width:78%}
  .hero__cta{top:250px}
  .hero__nav{left:24px;top:auto;bottom:66px}
  .hero__dots{left:24px;right:auto;top:auto;bottom:30px}
  .hero__scrim{background:linear-gradient(to right,#fff 0%,rgba(255,255,255,.9) 60%,rgba(255,255,255,.35) 100%)}
  .cards{grid-template-columns:1fr}
}

/* ─────────────────────────────────────────────
   Reduced motion
   ───────────────────────────────────────────── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  .rise,.reveal{opacity:1;transform:none;filter:none}
  .rise.is-out{opacity:1;filter:none}
  .divider{transform:none;opacity:1}
  .hero__media img.is-active{animation:none;transform:scale(1)}
}
</style>
</head>
<body>

<section class="news-section" id="news-section">
  <div class="container">

    <!-- Header -->
    <div class="section-head">
      <div class="section-head__text">
        <span class="chip reveal" style="--d:0ms">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 5h11a2 2 0 0 1 2 2v11H6a2 2 0 0 1-2-2z"/><path d="M17 9h2.2a1 1 0 0 1 .95.68L21 12v4a2 2 0 0 1-2 2h-2"/><path d="M8 9h5M8 13h5"/>
          </svg>
          공지 소식
        </span>
        <div class="section-head__text">
          <h2 class="reveal" style="--d:90ms">국가동물보호 소식</h2>
          <p class="reveal" style="--d:170ms">입양 캠페인, 정책 안내, 공지 등<br>국가동물보호 서비스의 최신 소식을 확인 할 수 있습니다.</p>
        </div>
      </div>
      <a class="viewall reveal" style="--d:250ms" href="#">전체보기 <span class="chev">›</span></a>
    </div>

    <hr class="divider">

    <div class="showcase">

      <!-- ── Hero News ───────────────────────── -->
      <article class="hero reveal" style="--d:330ms" id="hero" aria-roledescription="carousel" aria-label="국가동물보호 주요 소식">
        <div class="hero__media" id="heroMedia"></div>
        <div class="hero__scrim"></div>

        <div class="hero__body">
          <span class="hero__badge rise" id="heroBadge" style="--d:0ms"></span>
          <h3 class="hero__title rise" id="heroTitle" style="--d:110ms"></h3>
          <p class="hero__desc rise" id="heroDesc" style="--d:220ms"></p>
          <a class="hero__cta rise" id="heroCta" style="--d:330ms" href="#">자세히 보기 <span class="chev">›</span></a>
        </div>

        <div class="hero__nav">
          <span class="hero__counter"><b id="heroIndex">01</b><span id="heroTotal">/ 05</span></span>
          <button class="navbtn" id="prevBtn" type="button" aria-label="이전 소식">‹</button>
          <button class="navbtn" id="nextBtn" type="button" aria-label="다음 소식">›</button>
        </div>

        <div class="hero__dots" id="heroDots" role="tablist" aria-label="소식 선택"></div>
      </article>

      <!-- ── Notice panel ────────────────────── -->
      <aside class="notice reveal" style="--d:400ms" id="noticePanel">
        <div class="notice__head">
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M11.5 2.2 4.6 4.9H2.9A1.4 1.4 0 0 0 1.5 6.3v3.4a1.4 1.4 0 0 0 1.4 1.4h.6l.9 2.7a1 1 0 0 0 .95.7h.7a.8.8 0 0 0 .76-1.05l-.78-2.35h.02l4.95 1.95a.8.8 0 0 0 1.1-.75V2.95a.8.8 0 0 0-1.1-.75Z"/><path d="M14 6.2a.7.7 0 0 1 .7.7v2.2a.7.7 0 0 1-1.4 0V6.9a.7.7 0 0 1 .7-.7Z"/></svg>
          <h3>공지사항</h3>
          <a class="notice__more" href="#">더보기 <span class="chev">›</span></a>
        </div>
        <ul class="notice__list" id="noticeList"></ul>
      </aside>

      <!-- ── Card row ────────────────────────── -->
      <div class="cards" id="cardRow"></div>

    </div>
  </div>
</section>

<script>
(() => {
  'use strict';

  /* ── Data ─────────────────────────────────────────────────────────
     Figma "News Showcase" Page=1…5 / "News Card" 변형에서 추출.
     items[i] 하나가 Hero 한 장 + 하단 카드 한 장을 동시에 담당한다. */
  const items = [
    {
      key:'campaign', badge:'캠페인', tone:'primary', img:'assets/hero-1-campaign.png',
      heroTitle:['2026','입양 캠페인의 시작'],
      heroDesc :['새로운 가족을 기다리는 아이들에게','따뜻한 손길을 건네주세요.'],
      cardTitle:['2026 입양 캠페인','참여 안내'],
      cardDate :'2026-07-01 ~ 12-31'
    },
    {
      key:'event', badge:'행사', tone:'protected', img:'assets/hero-2-event.png',
      heroTitle:['2026 반려동물','문화축제'],
      heroDesc :['온 가족이 함께 즐기는','반려동물 축제에 초대합니다.'],
      cardTitle:['2026 반려동물 문화축제','참여 안내'],
      cardDate :'2026-08-15 ~ 08-16'
    },
    {
      key:'edu', badge:'교육', tone:'adoption', img:'assets/hero-3-edu.png',
      heroTitle:['반려인 대상','무료 교육 프로그램'],
      heroDesc :['전문가와 함께하는 체계적인','반려동물 교육을 만나보세요.'],
      cardTitle:['반려인 대상 무료 교육','프로그램 안내'],
      cardDate :'2026-07-10 ~ 08-20'
    },
    {
      key:'press', badge:'보도자료', tone:'ended', img:'assets/hero-4-notice.png',
      heroTitle:['국가동물24','서비스 개편 안내'],
      heroDesc :['더 빠르고 편리해진 서비스로','찾아뵙겠습니다.'],
      cardTitle:['동물보호 정책','추진 현황 발표'],
      cardDate :'2026-07-08'
    },
    {
      key:'story', badge:'입양후기', tone:'reserved', img:'assets/hero-5-story.png',
      heroTitle:['새 가족을 만난','아이들의 이야기'],
      heroDesc :['입양으로 새 삶을 시작한','아이들의 이야기를 만나보세요.'],
      cardTitle:['새 가족을 만난 아이들의','행복한 이야기'],
      cardDate :'2026-07-05'
    }
  ];

  const notices = [
    { title:'국가동물24 서비스 점검 안내',        date:'2026-07-20', flag:'중요' },
    { title:'동물등록 비용 지원 사업 안내',        date:'2026-07-18' },
    { title:'여름철 반려동물 건강관리 수칙',       date:'2026-07-15' },
    { title:'실종·습득동물 신고 포상금 제도 안내', date:'2026-07-12' },
    { title:'국가동물보호센터 자원봉사자 모집',    date:'2026-07-10' }
  ];

  const TONE = {
    primary  :{ fg:'var(--brand-primary)',    bg:'var(--brand-primary-surface)' },
    protected:{ fg:'var(--status-protected)', bg:'var(--status-protected-bg)'   },
    adoption :{ fg:'var(--status-adoption)',  bg:'var(--status-adoption-bg)'    },
    ended    :{ fg:'var(--status-ended)',     bg:'var(--status-ended-bg)'       },
    reserved :{ fg:'var(--status-reserved)',  bg:'var(--status-reserved-bg)'    }
  };

  const CARD_SLOTS = items.length - 1;                 // Hero 를 뺀 나머지 = 4장
  const DURATION   = parseInt(getComputedStyle(document.documentElement)
                       .getPropertyValue('--slide-duration'), 10) || 5000;
  const reduced    = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const pad = n => String(n + 1).padStart(2, '0');

  /* ── Elements ─────────────────────────────────────────────────── */
  const section   = document.getElementById('news-section');
  const hero      = document.getElementById('hero');
  const heroMedia = document.getElementById('heroMedia');
  const heroBadge = document.getElementById('heroBadge');
  const heroTitle = document.getElementById('heroTitle');
  const heroDesc  = document.getElementById('heroDesc');
  const heroCta   = document.getElementById('heroCta');
  const heroIndex = document.getElementById('heroIndex');
  const heroDots  = document.getElementById('heroDots');
  const cardRow   = document.getElementById('cardRow');
  const noticeList   = document.getElementById('noticeList');
  const noticePanel  = document.getElementById('noticePanel');
  const riseEls = [heroBadge, heroTitle, heroDesc, heroCta];

  document.getElementById('heroTotal').textContent = '/ ' + pad(items.length - 1);

  /* ── Build: hero image stack ──────────────────────────────────── */
  items.forEach((it, i) => {
    const img = new Image();
    img.src = it.img;
    img.alt = it.heroTitle.join(' ');
    img.decoding = 'async';
    if (i > 0) img.loading = 'lazy';
    heroMedia.appendChild(img);
  });
  const slides = [...heroMedia.children];

  /* ── Build: dots (with progress fill) ─────────────────────────── */
  const dots = items.map((it, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'dot';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-label', `${pad(i)} ${it.badge}`);
    b.innerHTML = '<span class="dot__fill"></span>';
    b.addEventListener('click', () => { go(i); restartTimer(); });
    heroDots.appendChild(b);
    return b;
  });
  const fills = dots.map(d => d.firstElementChild);

  /* ── Build: notice rows ───────────────────────────────────────── */
  notices.forEach((n, i) => {
    const li = document.createElement('li');
    li.className = 'notice__item reveal';
    li.style.setProperty('--d', (560 + i * 90) + 'ms');
    li.innerHTML =
      `<button class="notice__btn" type="button">
         <span class="notice__num">${pad(i)}</span>
         <span class="notice__title">${n.title}</span>
         ${n.flag ? `<span class="notice__flag">${n.flag}</span>` : ''}
         <span class="notice__date">${n.date}</span>
       </button>`;
    // 공지 Hover 시 Hero 변경
    li.addEventListener('mouseenter', () => { go(i); pause(); });
    li.addEventListener('focusin',    () => { go(i); pause(); });
    li.querySelector('.notice__btn').addEventListener('click', () => { go(i); restartTimer(); });
    noticeList.appendChild(li);
  });
  noticePanel.addEventListener('mouseleave', resume);
  noticePanel.addEventListener('focusout', e => {
    if (!noticePanel.contains(e.relatedTarget)) resume();
  });
  const noticeItems = [...noticeList.children];

  /* ── Build: card slots ────────────────────────────────────────── */
  const cards = Array.from({ length: CARD_SLOTS }, (_, i) => {
    const c = document.createElement('button');
    c.type = 'button';
    c.className = 'card reveal';
    c.style.setProperty('--d', (760 + i * 110) + 'ms');
    c.innerHTML =
      `<span class="card__media"><img alt=""></span>
       <span class="card__scrim"></span>
       <span class="card__body card__swap">
         <span class="card__badge"></span>
         <span class="card__title"></span>
         <span class="card__date"></span>
       </span>
       <span class="card__arrow">›</span>`;
    // 카드 클릭 → 해당 소식이 Hero 로
    c.addEventListener('click', () => {
      if (typeof c._target === 'number') { go(c._target); restartTimer(); }
    });
    cardRow.appendChild(c);
    return c;
  });

  /* ── Render ───────────────────────────────────────────────────── */
  let current = -1;

  function paintCards() {
    const rest = items.map((it, i) => ({ it, i })).filter(o => o.i !== current);
    cards.forEach((card, slot) => {
      const { it, i } = rest[slot];
      // _target = 화면에 곧 보이게 될 아이템. 전환 중에도 최신값이라 연속 클릭에 안전하다.
      if (card._target === i) return;
      card._target = i;
      clearTimeout(card._timer);                       // 대기 중인 이전 교체 취소

      const apply = () => {
        card.dataset.target = i;
        card.setAttribute('aria-label', `${it.badge} · ${it.cardTitle.join(' ')}`);
        const badge = card.querySelector('.card__badge');
        badge.textContent = it.badge;
        badge.style.color = TONE[it.tone].fg;
        badge.style.background = TONE[it.tone].bg;
        card.querySelector('.card__title').innerHTML = it.cardTitle.join('<br>');
        card.querySelector('.card__date').textContent = it.cardDate;
        const img = card.querySelector('.card__media img');
        if (img.getAttribute('src') !== it.img) { img.src = it.img; img.alt = ''; }
        card.classList.remove('is-swapping');
      };

      if (!card._painted || reduced) { card._painted = true; apply(); }
      else { card.classList.add('is-swapping'); card._timer = setTimeout(apply, 220); }
    });
  }

  const TEXT_OUT = 280;                                // 퇴장 페이드 길이 (CSS .is-out 과 동일)
  let entered = false, textToken = 0, textTimer = 0;

  function go(i) {
    i = (i + items.length) % items.length;
    if (i === current) return;
    const first = current === -1;
    current = i;
    const it = items[i];

    // Image: crossfade + Ken Burns 재시작
    slides.forEach((img, n) => {
      img.classList.toggle('is-active', n === i);
      if (n === i) { img.style.animation = 'none'; void img.offsetWidth; img.style.animation = ''; }
    });

    // Chrome(카운터·도트·공지·카드)은 즉시 갱신
    heroIndex.textContent = pad(i);
    dots.forEach((d, n) => {
      d.classList.toggle('is-active', n === i);
      d.setAttribute('aria-selected', String(n === i));
    });
    noticeItems.forEach((li, n) => li.classList.toggle('is-current', n === i));
    setProgress(0);
    paintCards();

    /* Text: 기존 문구가 제자리에서 녹아 사라진 뒤 → 교체 → 아래 20px에서 순차 Fade Up.
       token 으로 마지막 전환만 살아남게 해 연속 클릭 시 문구가 뒤섞이지 않는다. */
    const token = ++textToken;
    const swapText = () => {
      if (token !== textToken) return;
      heroBadge.textContent = it.badge;
      heroBadge.style.color = TONE[it.tone].fg;
      heroBadge.style.background = TONE[it.tone].bg;
      heroTitle.innerHTML = it.heroTitle.join('<br>');
      heroDesc.innerHTML  = it.heroDesc.join('<br>');
      heroCta.setAttribute('aria-label', `${it.heroTitle.join(' ')} 자세히 보기`);
      riseEls.forEach(el => el.classList.remove('is-out', 'is-in'));
      // 시작 상태를 확정시키는 reflow. 이 뒤에는 동기로 붙여도 트랜지션이 정상 재생되며,
      // rAF 에 의존하지 않으므로 백그라운드 탭에서 문구가 숨은 채 남지 않는다.
      void heroTitle.offsetWidth;
      if (!entered) return;                            // 섹션 진입 전이면 숨긴 채 대기
      riseEls.forEach(el => el.classList.add('is-in'));
    };

    clearTimeout(textTimer);
    if (first || reduced) swapText();
    else {
      riseEls.forEach(el => el.classList.add('is-out'));
      textTimer = setTimeout(swapText, TEXT_OUT);
    }
  }

  function setProgress(p) {
    fills.forEach((f, n) => { f.style.transform = `scaleX(${n === current ? p : 0})`; });
  }

  /* ── Autoplay timer (progress-driven, pausable) ───────────────── */
  let raf = 0, startedAt = 0, elapsed = 0, running = false;

  function frame(t) {
    if (!startedAt) startedAt = t;
    const p = Math.min((elapsed + (t - startedAt)) / DURATION, 1);
    setProgress(p);
    if (p >= 1) { elapsed = 0; startedAt = 0; go(current + 1); }
    raf = requestAnimationFrame(frame);
  }
  function start()  { if (running) return; running = true; hero.classList.remove('is-paused'); startedAt = 0; raf = requestAnimationFrame(frame); }
  function pause()  { if (!running) return; running = false; hero.classList.add('is-paused'); cancelAnimationFrame(raf); elapsed += performance.now() - startedAt; startedAt = 0; }
  function resume() { if (document.hidden) return; start(); }
  function restartTimer() { elapsed = 0; startedAt = 0; setProgress(0); if (!running) start(); }

  hero.addEventListener('mouseenter', pause);
  hero.addEventListener('mouseleave', resume);
  hero.addEventListener('focusin',  pause);
  hero.addEventListener('focusout', e => { if (!hero.contains(e.relatedTarget)) resume(); });
  document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());

  document.getElementById('prevBtn').addEventListener('click', () => { go(current - 1); restartTimer(); });
  document.getElementById('nextBtn').addEventListener('click', () => { go(current + 1); restartTimer(); });
  hero.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { go(current - 1); restartTimer(); }
    if (e.key === 'ArrowRight') { go(current + 1); restartTimer(); }
  });

  /* ── Section-entry choreography ───────────────────────────────── */
  go(0);                                   // entered=false 이므로 문구만 채우고 숨김 유지

  const heroBody = document.querySelector('.hero__body');

  const play = () => {
    section.classList.add('is-ready');
    entered = true;
    if (reduced) { heroBody.classList.add('is-settled'); riseEls.forEach(el => el.classList.add('is-in')); start(); return; }
    // Hero 이미지 Fade → 텍스트 순차 등장 → 공지 → 카드 (CSS --d 로 stagger)
    setTimeout(() => riseEls.forEach(el => el.classList.add('is-in')), 620);
    // 진입 연출(620 + 330 stagger + 720 duration)이 끝나면 문구를 고정 상태로 전환
    setTimeout(() => heroBody.classList.add('is-settled'), 1720);
    setTimeout(start, 1500);
  };

  if (reduced || !('IntersectionObserver' in window)) {
    play();
  } else {
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(en => { if (en.isIntersecting) { obs.disconnect(); play(); } });
    }, { threshold: .18 });
    io.observe(section);
  }
})();
</script>
</body>
</html>
